<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Don't Start Without Me</h1>
      <p class="tagline">Same scene, different countries.</p>
    </header>

    <!-- First run: a name is required -->
    <section id="name-view" hidden>
      <label>
        What should we call you?
        <input id="first-name" maxlength="40" placeholder="So they know who paused" />
      </label>
      <button id="save-first-name" class="primary">Continue</button>
    </section>

    <section id="join-view" hidden>
      <p class="me">Hi, <b class="my-name"></b> · <button class="link edit-name">edit</button></p>

      <button id="start" class="primary">Start a party</button>
      <p id="start-hint" class="hint"></p>

      <p class="or">or join theirs</p>
      <div class="row">
        <input id="room" maxlength="32" placeholder="Party code" />
        <button id="join">Join</button>
      </div>
      <p class="hint">Works from any tab. We'll open what they're watching.</p>

      <details>
        <summary>Advanced</summary>
        <label>
          Server
          <input id="server" />
        </label>
      </details>
    </section>

    <section id="party-view" hidden>
      <button id="copy-invite" class="primary">Copy invite link</button>
      <p class="label">or tell them the code: <code id="room-code"></code></p>
      <p id="status"></p>
      <ul id="peers"></ul>
      <p class="me">You're <b class="my-name"></b> · <button class="link edit-name">edit</button></p>
      <button id="leave">Leave party</button>
    </section>

    <!-- Rename, available everywhere -->
    <section id="rename-view" hidden>
      <label>
        Your name
        <input id="rename" maxlength="40" />
      </label>
      <div class="row">
        <button id="save-rename" class="primary">Save</button>
        <button id="cancel-rename">Cancel</button>
      </div>
    </section>

    <p id="error" class="error"></p>
    <script src="popup.js"></script>
  </body>
</html>
