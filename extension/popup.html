<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Don't Start Without Me</h1>
      <p class="tagline">Same scene, different countries.</p>
    </header>

    <section id="join-view" hidden>
      <label>
        Your name
        <input id="name" maxlength="40" placeholder="So they know who paused" />
      </label>

      <button id="start" class="primary">Start a party</button>

      <p class="or">or join theirs</p>
      <div class="row">
        <input id="room" maxlength="32" placeholder="Their party code" />
        <button id="join">Join</button>
      </div>

      <p id="join-hint" class="hint"></p>

      <details>
        <summary>Advanced</summary>
        <label>
          Server
          <input id="server" />
        </label>
      </details>
    </section>

    <section id="party-view" hidden>
      <p class="label">Party code — send it to them</p>
      <div class="room">
        <code id="room-code"></code>
        <button id="copy" title="Copy party code">Copy</button>
      </div>
      <p id="status"></p>
      <ul id="peers"></ul>
      <button id="leave">Leave party</button>
    </section>

    <p id="error" class="error"></p>
    <script src="popup.js"></script>
  </body>
</html>
